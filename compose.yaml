services:
  catalogue-web:
    build: ./catalogue-web
    ports:
      - "8080:80"
    depends_on:
      inventory-api:
        condition: service_started

  #inventory-api:

  inventory-db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  inventory_data:



